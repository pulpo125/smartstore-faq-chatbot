data:
  path: ./data/final_result.pkl

chroma_db:
  path: ./chroma_db
  collection_name: smartstore_faq
  max_chunk_size: 1000
  batch_size: 100
  n_results: 5

chat_message_history:
  collection_name: chat_history

faq_agent:
  last_n_turn: 5 # history 적용 turn 수
  verbose: false # 자세한 로그를 출력할지 여부. True면 자세한 로그(검색 결과 프린트)까지 출력, False면 최소한만 출력